# One-time Personal license activation file, per GameCI activation docs.
# Run this workflow manually (Actions > Acquire activation file > Run workflow),
# download the .alf artifact, upload it at license.unity3d.com, download the
# .ulf license, base64-encode it, and save it as the UNITY_LICENSE secret.
# This workflow does NOT need UNITY_LICENSE/EMAIL/PASSWORD to run.
# Delete or disable it after the license secret is created, if you wish.
name: Acquire activation file
on:
  workflow_dispatch: {}
jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v4
        with:
          unityVersion: auto
      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
